    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {

      color: #f8fafc;
      min-height: 100vh;
    }
    .page-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 15px;
      font-size: 22px;
      color: #4ade80;
    }
    .status-bar {
      width: 100%;
      max-width: 900px;
      padding: 12px 16px;
      background: #1e293b;
      border-radius: 10px;
      margin-bottom: 10px;
      font-size: 14px;
      color: #93c5fd;
      min-height: 44px;
      border-left: 4px solid #3b82f6;
    }
    .hint-box {
      width: 100%;
      max-width: 900px;
      padding: 10px 14px;
      background: rgba(251, 191, 36, 0.08);
      border: 1px solid #f59e0b;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 13px;
      color: #fcd34d;
      line-height: 1.5;
    }
    .video-wrapper {
      width: 100%;
      max-width: 900px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 4px solid #e2e8f0;
      margin-bottom: 10px;
      position: relative;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    video {
      width: 100%;
      height: auto;
      aspect-ratio: 16/9;
      background: #000;
      display: block;
      transition: all 0.3s ease;
    }
    video.mode-contain { object-fit: contain; }
    video.mode-cover  { object-fit: cover; }
    video.mode-fill   { object-fit: fill; }
    video.mode-16-9   { object-fit: contain; aspect-ratio: 16/9; }
    video.mode-4-3    { object-fit: contain; aspect-ratio: 4/3; }

    .size-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 15px;
      width: 100%;
      max-width: 900px;
    }
    .size-btn {
      background: #1e293b;
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      border: 2px solid #475569;
      cursor: pointer;
      font-family: 'Prompt', sans-serif;
      font-size: 13px;
      transition: all 0.2s;
    }
    .size-btn:hover, .size-btn.active {
      background: #334155;
      border-color: #4ade80;
      color: #4ade80;
    }

    .categories, .channels {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 900px;
    }
    .channel-button {
      background: #1e293b;
      color: #fff;
      padding: 10px 12px;
      border-radius: 10px;
      border: 2px solid #475569;
      cursor: pointer;
      text-align: center;
      width: 130px;
      font-family: 'Prompt', sans-serif;
      outline: none;
      transition: all 0.2s;
    }
    .channel-button:hover,
    .channel-button:focus {
      background: #334155;
      border-color: #4ade80;
      transform: translateY(-2px);
    }
    .channel-button img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      border-radius: 6px;
      margin-bottom: 6px;
      background: #fff;
    }
    .back-btn {
      background: #3b82f6;
      border-color: #2563eb;
    }
    @media (max-width: 600px) {
      .channel-button { width: 110px; font-size: 12px; padding: 8px; }
      .channel-button img { width: 36px; height: 36px; }
      .size-btn { font-size: 12px; padding: 6px 10px; }
    }
  </style>
</head>

// ==============================================
// 🎯 ตัวแปร
// ==============================================
const video = document.getElementById('video');
const statusBar = document.getElementById('statusBar');
const categoriesDiv = document.getElementById('categories');
const channelsDiv = document.getElementById('channels');
const sizeButtons = document.querySelectorAll('.size-btn');

let hls = null, dashPlayer = null;
let allCategories = [];

// ==============================================
// 🎛️ เปลี่ยนโหมดขนาดภาพ
// ==============================================
function setVideoSizeMode(mode) {
  video.classList.remove('mode-contain','mode-cover','mode-fill','mode-16-9','mode-4-3');
  sizeButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));

  if (mode === 'full') {
    if (video.requestFullscreen) video.requestFullscreen();
    else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
    return;
  }
  video.classList.add(`mode-${mode}`);
  const labels = { contain:'มีขอบดำ', cover:'เต็มจอไม่มีขอบ', fill:'ขยายเต็มจอ', '16-9':'16:9 มาตรฐาน', '4-3':'4:3 แบบเก่า' };
  statusBar.textContent = `✅ โหมด: ${labels[mode]}`;
}
sizeButtons.forEach(btn => {
  btn.addEventListener('click', () => setVideoSizeMode(btn.dataset.mode));
});

// ==============================================
// 🔧 แปลงเนื้อหา M3U
// ==============================================
function parseM3U(text) {
  const lines = text.split('\n').filter(line => line.trim() !== '' && !line.startsWith('#EXTM3U') && !line.startsWith('#EXT-X-VERSION'));
  const categories = {};
  let current = { name:'', logo:'', stream:'', referer:'https://madoball.com' };
  let groupTitle = 'อื่นๆ';

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (line.startsWith('#EXTINF:')) {
      const groupMatch = line.match(/group-title="([^"]*)"/);
      if (groupMatch) groupTitle = groupMatch[1];
      const logoMatch = line.match(/tvg-logo="([^"]*)"/);
      const nameMatch = line.match(/,(.+)$/);
      current = {
        name: nameMatch ? nameMatch[1].trim() : 'ไม่ระบุ',
        logo: logoMatch ? logoMatch[1] : '',
        stream: '',
        referer: 'https://madoball.com'
      };
    }
    else if (line.startsWith('#EXTVLCOPT:http-referrer=')) {
      current.referer = line.replace('#EXTVLCOPT:http-referrer=', '').trim();
    }
    else if (!line.startsWith('#') && line.startsWith('http')) {
      current.stream = line;
      if (!categories[groupTitle]) categories[groupTitle] = [];
      categories[groupTitle].push({ ...current });
      current = { name:'', logo:'', stream:'', referer:'https://madoball.com' };
    }
  }

  allCategories = Object.keys(categories).map(name => ({ name, channels: categories[name] }));
}

// ==============================================
// 🔍 ตรวจสอบประเภทสตรีม
// ==============================================
function getStreamType(url) {
  const lower = url.toLowerCase();
  if (lower.includes('.m3u8') || lower.includes('/chunks.m3u8')) return 'hls';
  if (lower.includes('.mpd')) return 'dash';
  return 'hls';
}

// ==============================================
// ▶️ เล่นช่อง
// ==============================================
function playChannel(channel) {
  statusBar.textContent = `⏳ กำลังโหลด: ${channel.name}...`;
  stopVideo();
  const type = getStreamType(channel.stream);
  if (type === 'hls') playHLS(channel);
  else if (type === 'dash') playDASH(channel);
  else statusBar.textContent = `❌ ไม่รู้จักประเภทสตรีม`;
}

// ==============================================
// ▶️ เล่น HLS — ส่ง Referer
// ==============================================
function playHLS(channel) {
  // ✅ ลองโหมดเนทีฟก่อน
  if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = channel.stream;
    video.play().catch(() => {});
    statusBar.textContent = `✅ [HLS-Native] กำลังเล่น: ${channel.name}`;
    return;
  }

  // ✅ ใช้ hls.js พร้อมส่ง Referer Header
  if (Hls.isSupported()) {
    hls = new Hls({
      maxBufferLength: 30,
      maxMaxBufferLength: 60,
      liveSyncDurationCount: 3,
      xhrSetup: function(xhr) {
        if (channel.referer) {
          xhr.setRequestHeader('Referer', channel.referer);
        }
      }
    });

    hls.loadSource(channel.stream);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      statusBar.textContent = `✅ [HLS] กำลังเล่น: ${channel.name}`;
      video.play().catch(() => {
        statusBar.textContent = `⚠️ คลิกที่วิดีโอเพื่อเริ่มเล่น: ${channel.name}`;
      });
    });

    hls.on(Hls.Events.ERROR, (_, data) => {
      if (data.fatal) {
        statusBar.textContent = `❌ เล่นไม่ได้: ${channel.name} — อาจถูกบล็อก CORS`;
        console.error('HLS Error:', data);
      }
    });
  }
}

// ==============================================
// ▶️ เล่น DASH
// ==============================================
function playDASH(channel) {
  dashPlayer = dashjs.MediaPlayer().create();
  dashPlayer.initialize(video, channel.stream, true);
  dashPlayer.on('streamInitialized', () => {
    statusBar.textContent = `✅ [DASH] กำลังเล่น: ${channel.name}`;
  });
  dashPlayer.on('error', () => {
    statusBar.textContent = `❌ DASH เล่นไม่ได้: ${channel.name}`;
  });
}

// ==============================================
// ⏹️ หยุดวิดีโอ
// ==============================================
function stopVideo() {
  if (hls) { hls.destroy(); hls = null; }
  if (dashPlayer) { dashPlayer.reset(); dashPlayer = null; }
  video.removeAttribute('src');
  video.load();
}

// ==============================================
// 📂 แสดงหมวดหมู่
// ==============================================
function renderCategories() {
  categoriesDiv.innerHTML = channelsDiv.innerHTML = '';
  if (allCategories.length === 0) {
    statusBar.textContent = '❌ ไม่พบข้อมูลช่อง กรุณาตรวจสอบเนื้อหา M3U';
    return;
  }
  allCategories.forEach(cat => {
    const count = cat.channels.length;
    const btn = document.createElement('div');
    btn.className = 'channel-button';
    btn.innerHTML = `<div>${cat.name} (${count})</div>`;
    btn.onclick = () => renderChannels(cat);
    categoriesDiv.appendChild(btn);
  });
  statusBar.textContent = `✅ โหลดสำเร็จ — ${allCategories.length} หมวดหมู่`;
}

// ==============================================
// 📋 แสดงรายการช่อง
// ==============================================
function renderChannels(category) {
  categoriesDiv.innerHTML = channelsDiv.innerHTML = '';
  category.channels.forEach((ch, idx) => {
    const btn = document.createElement('div');
    btn.className = 'channel-button';
    btn.innerHTML = `
      <img src="${ch.logo}" alt="${ch.name}" loading="lazy" 
           onerror="this.src='https://via.placeholder.com/42?text=📺'">
      <div style="font-size:12px;line-height:1.4">${idx + 1}. ${ch.name}</div>
    `;
    btn.onclick = () => playChannel(ch);
    channelsDiv.appendChild(btn);
  });

  const backBtn = document.createElement('div');
  backBtn.className = 'channel-button back-btn';
  backBtn.innerHTML = '🔙 ย้อนกลับ';
  backBtn.onclick = renderCategories;
  channelsDiv.appendChild(backBtn);
}
